# .github/workflows/release.yml
name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push plugin
        run: |
          make VERSION=${{ steps.version.outputs.VERSION }} clean build create push
          # Also push as latest
          docker plugin create ashutoshpw/axiom-docker-logger:latest ./plugin
          docker plugin push ashutoshpw/axiom-docker-logger:latest
