name: Publish managed plugins
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
# Serialize promotion across edge and release runs; never cancel a partial push.
concurrency:
  group: plugin-publication
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      candidate: ${{ steps.meta.outputs.candidate }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version=edge
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            echo 'Only main or semantic version tags can publish' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  validate:
    needs: metadata
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: [metadata, validate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
      - run: tar -xzf plugin.tar.gz -C plugin
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish managed plugin candidates to both registries
        env:
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
          ARCH: ${{ matrix.arch }}
        run: |
          for repo in ashutoshpw/axiom-docker-logger ghcr.io/ashutoshpw/axiom-docker-logger; do
            ./scripts/publish.sh "$repo:$CANDIDATE-$ARCH"
          done
  verify:
    needs: [metadata, candidate]
    strategy:
      fail-fast: false
      matrix:
        repo: [ashutoshpw/axiom-docker-logger, ghcr.io/ashutoshpw/axiom-docker-logger]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Anonymous installation and delivery verification
        env:
          REPO: ${{ matrix.repo }}
          ARCH: ${{ matrix.arch }}
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
        run: ./scripts/smoke.sh "$REPO:$CANDIDATE-$ARCH"
  promote:
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified digests
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          latest=false
          if [[ "$VERSION" == edge ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [[ "$head" != "$GITHUB_SHA" ]]; then echo 'Skipping obsolete edge run'; exit 0; fi
            mode=mutable
          else
            mode=immutable
            if [[ "$VERSION" != *-* ]]; then
              newest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              [[ "$newest" != "v$VERSION" ]] || latest=true
            fi
          fi
          for repo in ashutoshpw/axiom-docker-logger ghcr.io/ashutoshpw/axiom-docker-logger; do
            for arch in amd64 arm64; do
              source_ref="$repo:$CANDIDATE-$arch"
              ./scripts/promote.sh "$source_ref" "$repo:$VERSION-$arch" "$mode"
              if [[ "$arch" == amd64 ]]; then ./scripts/promote.sh "$source_ref" "$repo:$VERSION" "$mode"; fi
              if [[ "$latest" == true ]]; then
                ./scripts/promote.sh "$source_ref" "$repo:latest-$arch" mutable
                if [[ "$arch" == amd64 ]]; then ./scripts/promote.sh "$source_ref" "$repo:latest" mutable; fi
              fi
            done
          done
